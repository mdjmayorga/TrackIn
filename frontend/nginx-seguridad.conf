# Cabeceras de seguridad del panel (`PROD-11`). Se incluye en el `server` y en
# cada `location` que tenga su propio `add_header`: en nginx, un `add_header` en
# un `location` anula TODOS los heredados del `server`, y el index.html se
# quedaría sin ellas.
#
# Content-Security-Policy: el token de sesión vive en sessionStorage o
# localStorage, y lo puede leer cualquier script que corra en la página. La
# política solo deja correr los scripts del propio panel. Lo de afuera que sí
# se permite:
#   - img-src:   los mosaicos de OpenStreetMap. Si el mapa pasa al plan B
#                (`PROD-05`), agregar aquí el dominio de los mosaicos nuevos.
#   - frame-src: el mapa en vivo de ShipsGo en el detalle (`US-44`).
#   - style-src 'unsafe-inline': Leaflet posiciona marcadores y mosaicos con
#                atributos `style`, y los íconos del mapa los traen en su HTML.
#   - connect-src 'self': el panel solo llama a su API, en el mismo origen. Si
#                algún día VITE_API_URL apunta a otro dominio, agregarlo aquí.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; frame-src https://embed.shipsgo.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
# Manda el origen, no la ruta, a otros sitios: el mapa de ShipsGo lo necesita
# para validar «Allowed HTTP Origins»; `no-referrer` lo rompería.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Lo mismo que frame-ancestors, para navegadores viejos.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS no va aquí: lo pone el proxy que termina el TLS (docs/deployment.md §3).
