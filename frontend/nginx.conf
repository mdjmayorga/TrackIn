# El panel y la API en un mismo origen (`TASK-09`): nginx sirve el bundle y
# reenvía `/api/` y `/health` al contenedor `backend`. Así el navegador no hace
# pedidos a otro dominio y no hace falta CORS. El TLS lo pone delante el proxy
# corporativo (SRS §1.2.2).

# No anunciar la versión de nginx en las cabeceras ni en las páginas de error
# (`PROD-11`). Este archivo se incluye dentro de `http`, así que vale para todo.
server_tokens off;

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/seguridad.conf;

    root /usr/share/nginx/html;
    index index.html;

    # La carga del Z-tracking acepta hasta 20 MB (`carga_archivo.TAMANO_MAXIMO_BYTES`):
    # con el límite por omisión de nginx (1 MB) el WK38 real ya no entraría.
    client_max_body_size 21m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La carga de un Excel con ShipsGo completando destinos puede tardar;
        # el panel espera hasta 60 s (`services/cargas.ts`).
        proxy_read_timeout 90s;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # React Router maneja el ruteo del lado del cliente: cualquier ruta
    # desconocida debe devolver index.html en vez de un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/seguridad.conf;
    }

    # index.html nunca se cachea: es lo que apunta a los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/seguridad.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
