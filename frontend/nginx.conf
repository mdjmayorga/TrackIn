server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router maneja el ruteo del lado del cliente: cualquier ruta
    # desconocida debe devolver index.html en vez de un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: es lo que apunta a los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
